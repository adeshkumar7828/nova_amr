; Nova AMR - ESP32 firmware
; Build + Upload from VS Code (PlatformIO). If upload can't find the board,
; uncomment upload_port and put your COM port (Device Manager -> Ports).

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
; upload_port = COM3
lib_deps =
    links2004/WebSockets @ ^2.6.1
    bblanchon/ArduinoJson @ ^7.2.0
